<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ica10 — Random Christmas Trivia</title>

  <!-- Correct link to your CSS file -->
  <link rel="stylesheet" href="ica10.css" />
</head>
<body>
  <div class="app">
    <header>Random Christmas Trivia</header>

    <section class="quotes">
      <div class="quote-text" id="js-quote-text">Loading a question…</div>
      <div class="quote-text" id="js-answer-text" style="display:none;"></div>
    </section>

    <section class="controls">
      <button type="button" id="js-new-quote" class="new-quote button">
        Generate a new bit of trivia!
      </button>
      <button type="button" id="js-show-answer" class="twitter button">
        Show me the answer!
      </button>
    </section>
  </div>

  <!-- Link to your JavaScript -->
  <script src="ica10.js" defer></script>
</body>
</html>
